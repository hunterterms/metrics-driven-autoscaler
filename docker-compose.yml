services:
  catalog-service:
    build: ./services/catalog-service
    ports: ["8081:8080"]
  
  cart-service:
    build: ./services/cart-service
    ports: ["8082:8080"]
  
  checkout-service:
    build: ./services/checkout-service
    ports: ["8003:8080"]
    environment:
      WORKER_CONCURRENCY: "3"
    
  api-gateway:
    build: ./services/api-gateway
    ports: ["8080:8080"]
    depends_on: [catalog-service, cart-service, checkout-service]
    environment:
      CATALOG_URL: "http://catalog-service:8080"
      CART_URL: "http://cart-service:8080"
      CHECKOUT_URL: "http://checkout-service:8080"

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
  