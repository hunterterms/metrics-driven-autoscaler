global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api-gateway
    static_configs: [{ targets: ["api-gateway:8080"] }]
  - job_name: cart-service
    static_configs: [{ targets: ["cart-service:8080"] }]
  - job_name: catalog-service
    static_configs: [{ targets: ["catalog-service:8080"] }]
  - job_name: checkout-service
    static_configs: [{ targets: ["checkout-service:8080"] }]
